name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      bundle_id:
        description: "Optional bundle id (e.g. com.giofy.spotify) so this installs next to another Spotify mod. Empty keeps Spotify's."
        default: ""
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid uv
          # pipeline.sh wants cyan in its own uv tool environment with Pillow (needed for --icon).
          uv tool install --force --with pillow 'cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          ls -l ipa/spotify.ipa
          if ! unzip -tq ipa/spotify.ipa >/dev/null 2>&1; then
            echo "::error::The download is not a complete IPA ($(stat -f%z ipa/spotify.ipa 2>/dev/null || stat -c%s ipa/spotify.ipa) bytes, starts with: $(head -c 40 ipa/spotify.ipa | tr -c '[:print:]' '.')). The host cut it off or sent a web page: use a direct link to the whole file."
            exit 1
          fi

      - name: Build
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: make release APP_NAME=Giofy

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: Glassify.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="glassify-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
